<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrellas - Email Confirmation</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="emailconfirmation.css">
</head>
<body>
    <div class="container-fluid g-0 h-100">
        <div class="row g-0 h-100">
            <!-- Left Image Section -->
            <div class="col-lg-6 col-md-6 d-none d-md-block image-section">
                <img src="../image/holdinghands.png" alt="Caring hands" class="img-fluid h-100 w-100">
            </div>
            
            <!-- Right Form Section -->
            <div class="col-lg-6 col-md-6 confirmation-section">
                <div class="d-flex flex-column h-100 px-4 px-md-5">
                    <!-- Header Section -->
                    <div class="header-section mt-4 mb-4">
                        <div class="header-content d-flex align-items-center gap-4 mb-3">
                            <div class="logo">
                                <img src="../image/logowestrellas.png" alt="Estrellas Logo" class="logo-img">
                            </div>
                            <p class="tagline mb-0">Your Health is our Highly Priority</p>
                        </div>
                        <div class="header-divider"></div>
                    </div>
                    
                    <!-- Confirmation Form -->
                    <div class="confirmation-form flex-grow-1 d-flex flex-column justify-content-center">
                        <h1 class="form-title text-center mb-3">Enter confirmation code</h1>
                        <div class="instruction-text text-center mb-4">
                            <p class="mb-2">We sent a 6 digit code to <span class="email">agatha11@gmail.com</span></p>
                            <p class="mb-0">Enter the code below to confirm your email address</p>
                        </div>
                        
                        <form id="confirmationForm" class="needs-validation" novalidate>
                            <div class="code-inputs d-flex justify-content-center gap-3 mb-4">
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code1" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code2" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code3" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code4" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code5" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code6" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                            </div>
                            
                            <button type="submit" class="btn btn-primary continue-btn w-100 mb-3">
                                Continue
                            </button>
                        </form>
                        
                        <p class="resend-text text-center">
                            Didn't receive the email? <a href="#" class="resend-link" id="resendLink">Click to resend</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Pop-up -->
    <div class="notification-popup" id="notificationPopup">
        <div class="notification-content">
            <div class="notification-icon">
                <span id="notificationIcon">✓</span>
            </div>
            <div class="notification-message">
                <p id="notificationText">Message here</p>
            </div>
            <button class="notification-close" id="notificationClose">×</button>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script>
        // Auto-focus next input when typing
        const inputs = document.querySelectorAll('.code-box');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                // Only allow numbers
                this.value = this.value.replace(/[^0-9]/g, '');
                
                if (this.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
                
                // Allow arrow keys for navigation
                if (e.key === 'ArrowLeft' && index > 0) {
                    inputs[index - 1].focus();
                }
                if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            
            // Paste handling
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const pastedData = (e.clipboardData || window.clipboardData).getData('text');
                const digits = pastedData.replace(/[^0-9]/g, '').slice(0, 6);
                
                digits.split('').forEach((digit, i) => {
                    if (inputs[index + i]) {
                        inputs[index + i].value = digit;
                    }
                });
                
                // Focus the last filled input or next empty
                const nextEmpty = Array.from(inputs).findIndex((inp, i) => !inp.value && i >= index);
                if (nextEmpty !== -1) {
                    inputs[nextEmpty].focus();
                } else if (inputs[inputs.length - 1].value) {
                    inputs[inputs.length - 1].focus();
                }
            });
        });

        // Notification pop-up functions
        function showNotification(message, type = 'success') {
            const popup = document.getElementById('notificationPopup');
            const notificationText = document.getElementById('notificationText');
            const notificationIcon = document.getElementById('notificationIcon');
            
            notificationText.textContent = message;
            
            if (type === 'success') {
                notificationIcon.textContent = '✓';
                popup.classList.add('success');
                popup.classList.remove('error');
            } else {
                notificationIcon.textContent = '!';
                popup.classList.add('error');
                popup.classList.remove('success');
            }
            
            popup.classList.add('show');
            
            // Auto-hide after 4 seconds
            setTimeout(() => {
                hideNotification();
            }, 4000);
        }
        
        function hideNotification() {
            const popup = document.getElementById('notificationPopup');
            popup.classList.remove('show');
        }
        
        // Close button
        document.getElementById('notificationClose').addEventListener('click', hideNotification);
        
        // Click outside to close
        document.getElementById('notificationPopup').addEventListener('click', function(e) {
            if (e.target === this) {
                hideNotification();
            }
        });

        // Handle form submission
        const form = document.getElementById('confirmationForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let code = '';
            inputs.forEach(input => {
                code += input.value;
            });
            
            if (code.length === 6) {
                // Redirect to create new password page
                window.location.href = 'createnewpassword.html';
            } else {
                showNotification('Please enter all 6 digits to continue', 'error');
            }
        });

        // Resend link
        document.getElementById('resendLink').addEventListener('click', function(e) {
            e.preventDefault();
            showNotification('A new confirmation code has been sent to your email. Please check your inbox.', 'success');
        });

        // Focus first input on load
        window.addEventListener('load', function() {
            inputs[0].focus();
        });
    </script>
</body>
</html>
