<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Profile - Estrellas Homecare Clinic</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="accountprofile.css">
</head>
<body>
    <!-- Header -->
    <header class="dashboard-header">
        <div class="container-fluid px-0">
            <div class="row align-items-center g-0 py-2">
                <div class="col-md-6">
                    <a href="dashboard.html" class="header-logo-link">
                        <div class="header-logo d-flex align-items-center gap-3 ps-3">
                            <img src="../image/logo.jpg" alt="Estrellas Logo" class="logo-img">
                            <div>
                                <h4 class="logo-text mb-0">ESTRELLAS</h4>
                                <p class="logo-subtext mb-0">HOMECARE CLINIC, INC.</p>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-md-6">
                    <div class="header-user d-flex align-items-center justify-content-end gap-3 pe-4">
                        <div class="notification-wrapper position-relative">
                            <i class="bi bi-bell notification-icon"></i>
                            <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
                        </div>
                        <div class="user-menu-wrapper position-relative">
                            <div class="user-box-content" onclick="toggleUserMenu(event)">
                                <span class="user-greeting" id="userGreeting"><strong>Rossy Alberto</strong></span>
                                <div class="user-avatar"></div>
                            </div>
                            <div class="user-dropdown-menu" id="userDropdown">
                                <a href="AccountProfile.html" class="dropdown-item">
                                    <i class="bi bi-person"></i> Profile
                                </a>
                                <a href="Settings.html" class="dropdown-item">
                                    <i class="bi bi-gear"></i> Settings
                                </a>
                                <hr class="dropdown-divider">
                                <a href="Login1stpage.html" class="dropdown-item">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="header-divider"></div>
    </header>

    <!-- Main Content -->
    <main class="profile-container">
        <div class="container-fluid">
            <div class="profile-header">
                <h1 class="profile-title">Account Profile</h1>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- Account Profile Form -->
                    <div class="profile-section">
                        <form id="accountProfileForm" class="register-form">
                            <!-- Personal Information Section -->
                            <div class="form-section-header">
                                <i class="bi bi-person-fill"></i>
                                <h2 class="form-section-title">Personal Information</h2>
                            </div>

                            <!-- First Name and Middle Name -->
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label"><i class="bi bi-person"></i> First Name <span class="required">*</span></label>
                                    <input type="text" class="form-control form-input" id="firstName" placeholder="Enter your first name" value="Rossy" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label"><i class="bi bi-person"></i> Middle Name</label>
                                    <input type="text" class="form-control form-input" id="middleName" placeholder="Enter your middle name">
                                </div>
                            </div>

                            <!-- Last Name -->
                            <div class="form-group">
                                <label class="form-label"><i class="bi bi-person"></i> Last Name <span class="required">*</span></label>
                                <input type="text" class="form-control form-input" id="lastName" placeholder="Enter your last name" value="Alberto" required>
                            </div>

                            <!-- Divider -->
                            <div class="form-divider"></div>

                            <!-- Date of Birth & Gender -->
                            <div class="form-section-header">
                                <i class="bi bi-calendar-event"></i>
                                <h2 class="form-section-title">Birth & Gender</h2>
                            </div>

                            <!-- Date of Birth -->
                            <div class="form-group">
                                <label class="form-label"><i class="bi bi-calendar"></i> Date of Birth <span class="required">*</span></label>
                                <div class="date-inputs">
                                    <select class="form-control form-input date-select" id="monthSelect" required>
                                        <option value="">MM</option>
                                        <option value="01">01</option>
                                        <option value="02">02</option>
                                        <option value="03">03</option>
                                        <option value="04">04</option>
                                        <option value="05">05</option>
                                        <option value="06">06</option>
                                        <option value="07">07</option>
                                        <option value="08">08</option>
                                        <option value="09">09</option>
                                        <option value="10">10</option>
                                        <option value="11">11</option>
                                        <option value="12">12</option>
                                    </select>
                                    <select class="form-control form-input date-select" id="daySelect" required>
                                        <option value="">DD</option>
                                        <option value="01">01</option>
                                        <option value="02">02</option>
                                        <option value="03">03</option>
                                        <option value="04">04</option>
                                        <option value="05">05</option>
                                        <option value="06">06</option>
                                        <option value="07">07</option>
                                        <option value="08">08</option>

                                        <option value="10">10</option>
                                        <option value="11">11</option>
                                        <option value="12">12</option>
                                        <option value="13">13</option>
                                        <option value="14">14</option>
                                        <option value="15" selected>15</option>
                                        <option value="16">16</option>
                                        <option value="17">17</option>
                                        <option value="18">18</option>
                                        <option value="19">19</option>
                                        <option value="20">20</option>
                                        <option value="21">21</option>
                                        <option value="22">22</option>
                                        <option value="23">23</option>
                                        <option value="24">24</option>
                                        <option value="25">25</option>
                                        <option value="26">26</option>
                                        <option value="27">27</option>
                                        <option value="28">28</option>
                                        <option value="29">29</option>
                                        <option value="30">30</option>
                                        <option value="31">31</option>
                                    </select>
                                    <select class="form-control form-input date-select" id="yearSelect" required>
                                        <option value="">YYYY</option>
                                        <option value="1950">1950</option>
                                        <option value="1951">1951</option>
                                        <option value="1952">1952</option>
                                        <option value="1953">1953</option>
                                        <option value="1954">1954</option>
                                        <option value="1955">1955</option>
                                        <option value="1956">1956</option>
                                        <option value="1957">1957</option>
                                        <option value="1958">1958</option>
                                        <option value="1959">1959</option>
                                        <option value="1960">1960</option>
                                        <option value="1961">1961</option>
                                        <option value="1962">1962</option>
                                        <option value="1963">1963</option>
                                        <option value="1964">1964</option>
                                        <option value="1965">1965</option>
                                        <option value="1966">1966</option>
                                        <option value="1967">1967</option>
                                        <option value="1968">1968</option>
                                        <option value="1969">1969</option>

                                        <option value="1977">1977</option>

                                        <option value="1981">1981</option>
                                        <option value="1982">1982</option>
                                        <option value="1983">1983</option>
                                        <option value="1984">1984</option>
                                        <option value="1985">1985</option>
                                        <option value="1986">1986</option>
                                        <option value="1987">1987</option>
                                        <option value="1988">1988</option>
                                        <option value="1989">1989</option>
                                        <option value="1990">1990</option>
                                        <option value="1991">1991</option>
                                        <option value="1992">1992</option>
                                        <option value="1993">1993</option>
                                        <option value="1994">1994</option>
                                        <option value="1995">1995</option>
                                        <option value="1996">1996</option>
                                        <option value="1997">1997</option>
                                        <option value="1998">1998</option>
                                        <option value="1999">1999</option>
                                        <option value="2000">2000</option>
                                        <option value="2001">2001</option>

                                        <option value="2003">2003</option>

                                    </select>
                                </div>
                            </div>

                            <!-- Gender -->
                            <div class="form-group">
                                <label class="form-label"><i class="bi bi-person-badge"></i> Gender <span class="required">*</span></label>
                                <select class="form-control form-input" id="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female" selected>Female</option>
                                    
                                </select>
                            </div>

                            <!-- Divider -->
                            <div class="form-divider"></div>

                            <!-- Contact Information Section -->
                            <div class="form-section-header">
                                <i class="bi bi-telephone-fill"></i>
                                <h2 class="form-section-title">Contact Information</h2>
                            </div>

                            <!-- Contact Number -->
                            <div class="form-group">
                                <label class="form-label"><i class="bi bi-telephone"></i> Contact Number <span class="required">*</span></label>
                                <input type="tel" class="form-control form-input" id="contactNumber" placeholder="e.g., +63 975 123 4567" value="+63 975 123 4567" required>
                            </div>

                            <!-- Email Address -->
                            <div class="form-group">
                                <label class="form-label"><i class="bi bi-envelope-fill"></i> Email Address <span class="required">*</span></label>
                                <input type="email" class="form-control form-input" id="email" placeholder="e.g., rossy.alberto@email.com" value="rossy.alberto@email.com" required>
                            </div>

                            <div class="form-divider"></div>

                            <!-- Address Section -->
                            <div class="form-section-header">
                                <i class="bi bi-geo-alt-fill"></i>
                                <h2 class="form-section-title">Address</h2>
                            </div>

                            <!-- Address -->
                            <div class="form-group">
                                <label class="form-label"><i class="bi bi-house"></i> Full Address <span class="required">*</span></label>
                                <input type="text" class="form-control form-input" id="address" placeholder="Enter your complete address" value="123 Main Street, Barangay San Isidro, Parañaque City" required>
                            </div>

                            <!-- Submit Button -->
                            <div class="form-actions">
                                <button type="submit" class="btn btn-save">
                                    <i class="bi bi-check-circle"></i> Save Changes
                                </button>
                                <button type="reset" class="btn btn-cancel">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Toggle user menu dropdown
        function toggleUserMenu(event) {
            event.preventDefault();
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('active');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const userMenuWrapper = document.querySelector('.user-menu-wrapper');
            const dropdown = document.getElementById('userDropdown');
            
            if (userMenuWrapper && !userMenuWrapper.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });

        // Form submission handler
        document.getElementById('accountProfileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Collect form data
            const formData = {
                firstName: document.getElementById('firstName').value,
                middleName: document.getElementById('middleName').value,
                lastName: document.getElementById('lastName').value,
                dob: `${document.getElementById('monthSelect').value}/${document.getElementById('daySelect').value}/${document.getElementById('yearSelect').value}`,
                gender: document.getElementById('gender').value,
                contactNumber: document.getElementById('contactNumber').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value
            };
            
            console.log('Form data:', formData);
            alert('Profile updated successfully!');
        });
    </script>
</body>
</html>
