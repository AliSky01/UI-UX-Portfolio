<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrellas - Email Confirmation</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="emailconfirmation.css">
</head>
<body>
    <div class="container-fluid g-0 h-100">
        <div class="row g-0 h-100">
            <!-- Left Image Section -->
            <div class="col-lg-6 col-md-6 d-none d-md-block image-section">
                <img src="../image/holdinghands.png" alt="Caring hands" class="img-fluid h-100 w-100">
            </div>
            
            <!-- Right Form Section -->
            <div class="col-lg-6 col-md-6 confirmation-section">
                <div class="d-flex flex-column h-100 px-4 px-md-5">
                    <!-- Header Section -->
                    <div class="header-section mt-4 mb-4">
                        <div class="header-content d-flex align-items-center gap-4 mb-3">
                            <div class="logo">
                                <img src="../image/logowestrellas.png" alt="Estrellas Logo" class="logo-img">
                            </div>
                            <p class="tagline mb-0">Your Health is our Highly Priority</p>
                        </div>
                        <div class="header-divider"></div>
                    </div>
                    
                    <!-- Confirmation Form -->
                    <div class="confirmation-form flex-grow-1 d-flex flex-column justify-content-center">
                        <h1 class="form-title text-center mb-3">Enter confirmation code</h1>
                        <div class="instruction-text text-center mb-4">
                            <p class="mb-2">We sent a 6 digit code to <span class="email">agatha11@gmail.com</span></p>
                            <p class="mb-0">Enter the code below to confirm your email address</p>
                        </div>
                        
                        <form id="confirmationForm" class="needs-validation" novalidate>
                            <div class="code-inputs d-flex justify-content-center gap-3 mb-4">
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code1" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code2" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code3" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code4" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code5" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                                <input 
                                    type="text" 
                                    maxlength="1" 
                                    class="form-control code-box text-center" 
                                    id="code6" 
                                    required
                                    pattern="[0-9]"
                                    inputmode="numeric"
                                >
                            </div>
                            
                            <button type="submit" class="btn btn-primary continue-btn w-100 mb-3">
                                Continue
                            </button>
                        </form>
                        
                        <p class="resend-text text-center">
                            Didn't receive the email? <a href="#" class="resend-link" id="resendLink">Click to resend</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Pop-up -->
    <div class="notification-popup" id="notificationPopup">
        <div class="notification-content">
            <div class="notification-icon">
                <span id="notificationIcon">✓</span>
            </div>
            <div class="notification-message">
                <p id="notificationText">Message here</p>
            </div>
            <button class="notification-close" id="notificationClose">×</button>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script>
        // Show email dynamically
        const email = sessionStorage.getItem('reset_email');
        if (email) document.querySelector('.email').textContent = email;

        const inputs = document.querySelectorAll('.code-box');

        inputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) inputs[index - 1].focus();
                if (e.key === 'ArrowLeft' && index > 0) inputs[index - 1].focus();
                if (e.key === 'ArrowRight' && index < inputs.length - 1) inputs[index + 1].focus();
            });
        });

        function showNotification(message, type = 'success') {
            const popup = document.getElementById('notificationPopup');
            document.getElementById('notificationText').textContent = message;
            document.getElementById('notificationIcon').textContent = type === 'success' ? '✓' : '!';
            popup.classList.toggle('success', type === 'success');
            popup.classList.toggle('error', type !== 'success');
            popup.classList.add('show');
            setTimeout(() => popup.classList.remove('show'), 4000);
        }

        document.getElementById('notificationClose').addEventListener('click', () => {
            document.getElementById('notificationPopup').classList.remove('show');
        });

        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const code = Array.from(inputs).map(i => i.value).join('');

            if (code.length < 6) {
                showNotification('Please enter all 6 digits', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('code', code);

            try {
                const response = await fetch('../php/verify_reset_code.php', { method: 'POST', body: formData });
                const result = await response.json();

                if (result.success) {
                    window.location.href = 'createnewpassword.html';
                } else {
                    showNotification(result.message, 'error');
                    inputs.forEach(i => i.value = '');
                    inputs[0].focus();
                }
            } catch (error) {
                showNotification('Something went wrong: ' + error.message, 'error');
            }
        });

        document.getElementById('resendLink').addEventListener('click', async function(e) {
            e.preventDefault();

            try {
                const response = await fetch('../php/resend_reset_code.php', { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    showNotification('A new code has been sent to your email!', 'success');
                } else {
                    showNotification(result.message, 'error');
                }
            } catch (error) {
                showNotification('Something went wrong: ' + error.message, 'error');
            }
        });

        window.addEventListener('load', () => inputs[0].focus());
    </script>
</body>
</html>
