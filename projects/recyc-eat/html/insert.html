<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Insert Your Recyclable</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/kiosk.css">
  <link rel="stylesheet" href="../css/insert.css">
</head>
<body>

  <div class="leaf-layer" aria-hidden="true">
    <span class="leaf leaf-1"></span>
    <span class="leaf leaf-2"></span>
    <span class="leaf leaf-3"></span>
    <span class="leaf leaf-4"></span>
    <span class="leaf leaf-5"></span>
    <span class="leaf leaf-6"></span>
  </div>
  <div class="kiosk-backdrop" aria-hidden="true"></div>

  <div class="kiosk-shell">
    <header class="kiosk-header">
      <img src="../images/logo.png" class="kiosk-logo" alt="EcoNova">
    </header>

    <main class="kiosk-main">
      <ol class="kiosk-progress" aria-label="Recycling progress">
        <li class="is-done"><span class="step-dot" aria-hidden="true">1</span>Prepare</li>
        <li class="is-current"><span class="step-dot" aria-hidden="true">2</span>Insert</li>
        <li><span class="step-dot" aria-hidden="true">3</span>Redeem</li>
      </ol>

      <div class="page-heading">
        <h1 class="kiosk-title">Insert Your <em>Recyclable</em></h1>
        <p class="kiosk-sub">Please insert one item at a time.</p>
      </div>

      <div class="kiosk-ring insert-ring" id="insertTarget" role="button" tabindex="0" aria-label="Insert a recyclable">
        <div class="kiosk-ring__orbit" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>

        <div class="kiosk-ring__disc">
          <div class="kiosk-ring__art">
            <img id="insertArt" src="../images/bottlesncan.png" alt="A plastic bottle and an aluminum can">
          </div>
        </div>
      </div>

      <p class="insert-status" id="waitingText" role="status" aria-live="polite">Waiting for Item...</p>
      <p class="insert-total" id="pointsTotal" hidden>Total points: <span id="pointsValue">0</span></p>

      <div class="redeem-choice" id="redeemChoice" hidden>
        <p class="kiosk-title redeem-choice__title">You have <span id="redeemChoicePoints">0</span> points</p>
        <p class="kiosk-sub redeem-choice__sub">Redeem a reward now, or keep inserting.</p>
        <div class="redeem-choice__actions">
          <button type="button" class="kiosk-btn kiosk-btn--primary kiosk-btn--lg" id="btnRedeem">Redeem</button>
          <button type="button" class="kiosk-btn kiosk-btn--ghost kiosk-btn--lg" id="btnContinue">Continue</button>
        </div>
      </div>

      <a href="recycling.html" class="kiosk-btn kiosk-btn--ghost" id="cancelVisit" role="button">
        CANCEL <span aria-hidden="true">&#10005;</span>
      </a>
    </main>
  </div>

  <footer class="kiosk-info">
    <span class="info-icon" aria-hidden="true">i</span>
    <span>Insert a plastic bottle or thin aluminum can to begin.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const BOTTLE = { label: "Plastic bottle", points: 5, image: "../images/bottle.png" };
    const THIN_CAN = { label: "Thin aluminum can", points: 7, image: "../images/can.png" };
    const target = document.getElementById("insertTarget");
    const waitingText = document.getElementById("waitingText");
    const pointsTotal = document.getElementById("pointsTotal");
    const pointsValue = document.getElementById("pointsValue");
    const insertArt = document.getElementById("insertArt");
    const redeemChoice = document.getElementById("redeemChoice");
    const redeemChoicePoints = document.getElementById("redeemChoicePoints");

    let clicks = 0;
    let total = parseInt(sessionStorage.getItem("totalPoints") || "0", 10) || 0;
    let items = [];
    try {
      items = JSON.parse(sessionStorage.getItem("sessionItems") || "[]");
      if (!Array.isArray(items)) items = [];
    } catch (error) {
      items = [];
    }

    function showTotal() {
      pointsTotal.hidden = false;
      pointsValue.textContent = String(total);
      if (total >= 40) {
        redeemChoicePoints.textContent = String(total);
        redeemChoice.hidden = false;
      }
    }

    if (total > 0) showTotal();

    function acceptItem() {
      clicks += 1;
      const item = clicks === 1 ? BOTTLE : THIN_CAN;
      total += item.points;
      items.push({ name: item.label, points: item.points });
      sessionStorage.setItem("totalPoints", String(total));
      sessionStorage.setItem("sessionItems", JSON.stringify(items));
      insertArt.src = item.image;
      insertArt.alt = item.label;
      waitingText.textContent = clicks === 1
        ? "Plastic bottle accepted. +" + item.points + " points"
        : "Thin aluminum can. +" + item.points + " points";
      showTotal();
    }

    target.addEventListener("click", acceptItem);
    target.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        acceptItem();
      }
    });

    document.getElementById("btnRedeem")?.addEventListener("click", function () {
      window.location.href = "redeemready.html";
    });
    document.getElementById("btnContinue")?.addEventListener("click", function () {
      redeemChoice.hidden = true;
      waitingText.textContent = "Drop the next thin aluminum can.";
    });
  </script>
  </body>
</html>
